<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coordination Challenge — Misi Integrasi Sistem Koordinasi</title>
<style>
:root{
  --bg0:#050f26;--bg1:#0a1d49;--bg2:#12306e;
  --card:rgba(255,255,255,.075);--card2:rgba(255,255,255,.12);--line:rgba(255,255,255,.16);
  --txt:#f5f9ff;--mut:#adc0e6;
  --blue:#38bdf8;--blue2:#2563eb;--green:#34d399;--green2:#059669;--purple:#a78bfa;--purple2:#7c3aed;--yellow:#fde047;--yellow2:#f59e0b;--red:#fb7185;--red2:#e11d48;
  --r:1.1rem;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:max(12px,min(1.25vw,2.2vh))}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg0);color:var(--txt);
  font-family:"Segoe UI","Trebuchet MS",system-ui,-apple-system,"Helvetica Neue",Arial,"Noto Sans",sans-serif;line-height:1.35}
body{background:
  radial-gradient(60rem 40rem at 85% -10%,rgba(124,58,237,.35),transparent 60%),
  radial-gradient(50rem 40rem at -10% 110%,rgba(37,99,235,.38),transparent 60%),
  linear-gradient(160deg,var(--bg1),var(--bg0) 70%);}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(255,255,255,.10) 1px,transparent 1.5px);background-size:2.2rem 2.2rem}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:disabled{cursor:not-allowed}
#app{position:relative;height:100%}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}
.stage{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.7rem;padding:.8rem 1.1rem}
.stage.enter{animation:pgIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes pgIn{from{opacity:0;transform:translateY(1.2rem) scale(.985)}to{opacity:1;transform:none}}

/* ---------- header ---------- */
.top{display:flex;align-items:center;gap:1rem;min-height:3.4rem}
.brand{display:flex;align-items:center;gap:.7rem}
.logo{width:3rem;height:3rem;border-radius:.9rem;display:grid;place-items:center;font-size:1.7rem;background:linear-gradient(135deg,var(--purple2),var(--blue2));box-shadow:0 .3rem 1rem rgba(124,58,237,.5)}
.top .brand>div:last-child{display:none}
.brand b{display:block;font-size:.95rem;letter-spacing:.12em;font-weight:900}
.brand small{color:var(--mut);font-size:.72rem}
.rtitle{flex:1;min-width:0}
.rtitle h1{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:.02em;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:linear-gradient(90deg,#fff,var(--blue) 55%,var(--yellow));-webkit-background-clip:text;background-clip:text;color:transparent}
.rtitle p{margin:.15rem 0 0;color:var(--mut);font-size:.9rem;font-weight:600;white-space:nowrap}
.steps{display:flex;gap:.4rem;align-items:center}
.stp{padding:.25rem .65rem;border-radius:2rem;font-weight:800;font-size:.8rem;background:var(--card);border:1px solid var(--line);color:var(--mut);white-space:nowrap}
.stp.on{background:linear-gradient(90deg,var(--purple2),var(--blue2));color:#fff;border-color:transparent;box-shadow:0 0 1rem rgba(124,58,237,.6)}
.stp.ok{background:rgba(52,211,153,.18);color:var(--green);border-color:rgba(52,211,153,.4)}
.ctrls{display:flex;gap:.5rem;align-items:center}
.ibtn{min-width:max(48px,2.9rem);min-height:max(48px,2.9rem);border-radius:.9rem;background:var(--card);border:1px solid var(--line);font-size:1.25rem;display:grid;place-items:center}
.ibtn:active{transform:scale(.94)}
.tbtn{min-height:max(48px,2.9rem);padding:0 1rem;border-radius:.9rem;border:2px dashed var(--purple);color:#e4d9ff;font-weight:800;font-size:.9rem;background:rgba(124,58,237,.18)}

/* ---------- buttons ---------- */
.btn{min-height:max(48px,3.2rem);padding:.7rem 1.6rem;border-radius:1rem;font-weight:900;font-size:1.05rem;letter-spacing:.03em;color:#fff;
  background:linear-gradient(180deg,#4f8dff,var(--blue2));box-shadow:0 .35rem 0 #1e3a8a,0 .8rem 1.4rem rgba(0,0,0,.35);transition:transform .08s,box-shadow .08s,filter .2s;display:inline-flex;align-items:center;justify-content:center;gap:.5rem}
.btn:active:not(:disabled){transform:translateY(.25rem);box-shadow:0 .1rem 0 #1e3a8a,0 .3rem .8rem rgba(0,0,0,.35)}
.btn.go{background:linear-gradient(180deg,#34d399,var(--green2));box-shadow:0 .35rem 0 #065f46,0 .8rem 1.4rem rgba(0,0,0,.35)}
.btn.warn{background:linear-gradient(180deg,#fde047,var(--yellow2));color:#3b2300;box-shadow:0 .35rem 0 #92400e,0 .8rem 1.4rem rgba(0,0,0,.35)}
.btn.danger{background:linear-gradient(180deg,#fb7185,var(--red2));box-shadow:0 .35rem 0 #881337,0 .8rem 1.4rem rgba(0,0,0,.35)}
.btn.ghost{background:var(--card2);box-shadow:none;border:1px solid var(--line)}
.btn.teach{background:rgba(124,58,237,.25);border:2px dashed var(--purple);box-shadow:none;color:#efe7ff}
.btn.teach.solid{background:linear-gradient(180deg,#8b5cf6,var(--purple2));border:0;box-shadow:0 .35rem 0 #4c1d95,0 .8rem 1.4rem rgba(0,0,0,.35)}
.btn.big{font-size:1.5rem;padding:1rem 3rem;min-height:4.4rem;border-radius:1.3rem}
.btn:disabled{filter:grayscale(.9) brightness(.6);box-shadow:none;transform:none}
.btn.sm{min-height:max(48px,2.6rem);padding:.4rem 1rem;font-size:.9rem;box-shadow:0 .2rem 0 rgba(0,0,0,.35)}

/* ---------- home ---------- */
.home{height:100%;display:grid;grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);gap:1.5rem;padding:1.4rem 2rem;align-items:center}
.home .l{display:flex;flex-direction:column;gap:1rem;min-width:0}
.eyebrow{display:inline-flex;gap:.6rem;align-items:center;align-self:flex-start;padding:.35rem 1rem;border-radius:2rem;background:rgba(253,224,71,.14);border:1px solid rgba(253,224,71,.5);color:var(--yellow);font-weight:900;letter-spacing:.12em;font-size:.9rem}
.home h1{margin:0;font-size:3.5rem;line-height:.98;font-weight:900;letter-spacing:.01em;
  background:linear-gradient(95deg,#fff 10%,var(--blue) 55%,var(--purple));-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 3rem rgba(56,189,248,.25)}
.home h2{margin:0;font-size:1.65rem;font-weight:700;color:#dbe8ff}
.pills{display:flex;gap:.6rem;flex-wrap:wrap}
.pill{padding:.35rem .9rem;border-radius:2rem;font-weight:800;font-size:.9rem;border:1px solid var(--line);background:var(--card)}
.pill.a{color:#fda4af}.pill.b{color:#7dd3fc}.pill.c{color:#fde68a}
.tcards{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.tcard{border-radius:1.1rem;padding:.75rem .9rem;background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 38%,#0b1a40),#0a1636);border:2px solid var(--tc);box-shadow:0 .5rem 1.4rem rgba(0,0,0,.3),inset 0 0 2rem color-mix(in srgb,var(--tc) 18%,transparent);animation:fadeUp .6s both}
.tcard small{display:block;font-size:.72rem;color:var(--mut);font-weight:700;margin-bottom:.25rem}
.tcard .tt{display:flex;align-items:center;gap:.6rem}
.tdot{width:2.4rem;height:2.4rem;border-radius:50%;background:var(--tc);flex:none;display:grid;place-items:center;font-weight:900;color:var(--ti);box-shadow:0 0 1rem var(--tc)}
.tname{width:100%;min-height:max(48px,2.9rem);font:inherit;font-weight:800;font-size:1.15rem;color:#fff;background:rgba(0,0,0,.3);border:2px solid rgba(255,255,255,.22);border-radius:.7rem;padding:.2rem .8rem;outline:none}
.tname:focus{border-color:var(--tc);box-shadow:0 0 0 .2rem color-mix(in srgb,var(--tc) 45%,transparent)}
.home .startrow{display:flex;gap:1.2rem;align-items:center;flex-wrap:wrap}
.facts{display:flex;gap:1.4rem;color:var(--mut);font-weight:700;font-size:.9rem}
.facts b{color:#fff;font-size:1.15rem}
.art{position:relative;aspect-ratio:1.18;max-height:92%;width:100%;justify-self:center}
.art svg{width:100%;height:100%;overflow:visible}
.orb{position:absolute;width:5.2rem;height:5.2rem;border-radius:50%;display:grid;place-items:center;font-size:2.6rem;background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.35),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(4px);box-shadow:0 0 2rem rgba(56,189,248,.35);animation:floaty 5s ease-in-out infinite}
.orb small{position:absolute;bottom:-1.5rem;font-size:.78rem;font-weight:800;color:#dbeafe;letter-spacing:.06em;white-space:nowrap}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-.9rem)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(1.4rem)}to{opacity:1;transform:none}}
.fu{animation:fadeUp .7s both}
.glowpulse{animation:glowp 3s ease-in-out infinite}
@keyframes glowp{0%,100%{filter:drop-shadow(0 0 .8rem rgba(167,139,250,.5))}50%{filter:drop-shadow(0 0 1.8rem rgba(56,189,248,.9))}}
.dash{stroke-dasharray:6 8;animation:dashm 2.2s linear infinite}
@keyframes dashm{to{stroke-dashoffset:-56}}
.nodep{animation:nodep 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes nodep{0%,100%{transform:scale(1)}50%{transform:scale(1.5)}}

/* ---------- board ---------- */
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:.7rem}
.bt{position:relative;border-radius:1rem;padding:.55rem .9rem;display:grid;grid-template-columns:auto 1fr auto;column-gap:.7rem;align-items:center;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 30%,#0b1a40),#0a1636);border:2px solid color-mix(in srgb,var(--tc) 55%,transparent);transition:transform .25s,box-shadow .25s}
.bt .tdot{width:2.2rem;height:2.2rem}
.bt .nm{font-weight:900;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt .sb{font-size:.78rem;color:var(--mut);font-weight:700}
.bt .sc{font-size:2rem;font-weight:900;line-height:1;color:#fff;font-variant-numeric:tabular-nums}
.bt .sc small{font-size:.8rem;color:var(--mut);font-weight:700}
.bt.turn{transform:translateY(-.3rem) scale(1.03);border-color:var(--tc);box-shadow:0 0 0 .2rem var(--tc),0 0 2rem var(--tc);animation:turnp 1.6s ease-in-out infinite}
@keyframes turnp{50%{box-shadow:0 0 0 .2rem var(--tc),0 0 3rem var(--tc)}}
.bt .tag{position:absolute;top:-.8rem;right:.8rem;background:var(--tc);color:var(--ti);font-weight:900;font-size:.68rem;padding:.12rem .6rem;border-radius:1rem;letter-spacing:.08em}
.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.35);color:var(--yellow)}}

/* ---------- main area ---------- */
.main{min-height:0;display:flex;flex-direction:column;gap:.7rem}
.turnbar{display:flex;align-items:center;gap:1rem;flex-wrap:wrap;padding:.5rem 1rem;border-radius:1rem;background:linear-gradient(90deg,color-mix(in srgb,var(--tc) 55%,#0b1a40),rgba(255,255,255,.05));border:2px solid var(--tc)}
.turnbar .who{font-size:1.4rem;font-weight:900}
.turnbar .who span{background:var(--tc);color:var(--ti);padding:.1rem .8rem;border-radius:.6rem;margin-left:.3rem}
.turnbar .hint{color:#e3ecff;font-weight:600;flex:1;font-size:1rem}
.prog{display:flex;align-items:center;gap:.6rem;font-weight:800;font-size:.95rem;color:var(--mut)}
.pbar{width:10rem;height:.7rem;border-radius:1rem;background:rgba(255,255,255,.14);overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--green),var(--blue));border-radius:1rem;transition:width .5s}
.grid12{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:.8rem}
.box{position:relative;border-radius:1.2rem;overflow:hidden;color:#fff;font-weight:900;display:grid;place-items:center;
  background:linear-gradient(145deg,#6d4cff,#2f6bff 55%,#14b8e6);border:2px solid rgba(255,255,255,.35);
  box-shadow:0 .4rem 0 rgba(10,20,80,.8),0 .9rem 1.6rem rgba(0,0,0,.35);transition:transform .15s,filter .2s;animation:fadeUp .5s both}
.box::before{content:"";position:absolute;left:0;right:0;top:50%;height:.9rem;transform:translateY(-50%);background:rgba(253,224,71,.85);box-shadow:0 0 1rem rgba(253,224,71,.6)}
.box::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:.9rem;transform:translateX(-50%);background:rgba(253,224,71,.85)}
.box .no{position:relative;z-index:2;font-size:3.2rem;line-height:1;width:5.2rem;height:5.2rem;border-radius:50%;display:grid;place-items:center;background:#0b1a4a;border:3px solid var(--yellow);box-shadow:0 0 1.2rem rgba(0,0,0,.5)}
.box .q{position:absolute;z-index:3;right:.7rem;bottom:.4rem;font-size:1.5rem;color:var(--yellow);text-shadow:0 .1rem .3rem rgba(0,0,0,.6)}
.box:hover:not(:disabled){transform:translateY(-.25rem) rotate(-1deg);filter:brightness(1.12)}
.box:active:not(:disabled){transform:scale(.96)}
.box.used{background:linear-gradient(145deg,color-mix(in srgb,var(--tc) 45%,#18233f),#111a33);border-color:var(--tc);box-shadow:none;filter:saturate(.8);animation:none}
.box.used::before,.box.used::after,.box.used .q{display:none}
.box.used .no{background:rgba(0,0,0,.35);border-color:rgba(255,255,255,.4);font-size:2.2rem;width:4rem;height:4rem}
.box .res{position:absolute;z-index:3;bottom:.5rem;left:0;right:0;text-align:center;font-size:1.05rem}
.box .res b{background:rgba(0,0,0,.45);padding:.1rem .7rem;border-radius:1rem}
.box.pend{border-color:var(--yellow);animation:turnp 1.4s infinite;--tc:var(--yellow)}

/* ---------- question ---------- */
.qwrap,.work{flex:1;min-height:0;display:flex;flex-direction:column;gap:.7rem}
.qscroll{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:.6rem;padding:.5rem .6rem .4rem .3rem;margin:-.3rem -.4rem 0 -.3rem}
.qfoot{display:flex;justify-content:flex-end;gap:.8rem;align-items:center;flex-wrap:wrap;padding-top:.1rem}
.qhead .timer{width:3.9rem;height:3.9rem}.qhead .timer span{font-size:1.3rem}.qhead .timer circle{stroke-width:10}
.qwrap.pop,.work.pop,.c3.pop{animation:popIn .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes popIn{from{opacity:0;transform:scale(.8) rotateX(30deg)}to{opacity:1;transform:none}}
.qhead{display:flex;align-items:center;gap:1rem}
.qhead .grow{flex:1}
.badge{display:inline-flex;align-items:center;gap:.5rem;padding:.3rem 1rem;border-radius:2rem;font-weight:900;background:var(--tc);color:var(--ti);font-size:1.1rem}
.badge.n{background:var(--card2);color:#fff;border:1px solid var(--line)}
.qtext{font-size:1.7rem;font-weight:700;line-height:1.35;padding:1.1rem 1.4rem;border-radius:1.2rem;background:var(--card);border:1px solid var(--line);box-shadow:inset 0 0 3rem rgba(56,189,248,.08)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:.8rem}
.opt{display:flex;align-items:center;gap:.9rem;text-align:left;padding:.8rem 1rem;min-height:4.4rem;border-radius:1.1rem;font-size:1.28rem;font-weight:700;line-height:1.25;
  background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(255,255,255,.05));border:2px solid var(--line);transition:transform .1s,border-color .2s,background .2s}
.opt .lt{flex:none;width:2.7rem;height:2.7rem;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:1.3rem;background:linear-gradient(135deg,var(--purple2),var(--blue2))}
.opt:hover:not(:disabled){border-color:var(--blue);transform:translateY(-.1rem)}
.opt:active:not(:disabled){transform:scale(.97)}
.opt:disabled{cursor:default}
.opt.right{background:linear-gradient(160deg,rgba(52,211,153,.5),rgba(5,150,105,.35));border-color:var(--green);animation:rightp .6s}
.opt.right .lt{background:var(--green2)}
.opt.wrong{background:linear-gradient(160deg,rgba(251,113,133,.5),rgba(225,29,72,.3));border-color:var(--red);animation:shake .45s}
.opt.wrong .lt{background:var(--red2)}
.opt.dim{opacity:.45}
.fb .qtext{font-size:1.4rem;padding:.7rem 1.1rem}
.fb .opt{min-height:3.3rem;font-size:1.08rem;padding:.35rem .9rem}.fb .opt .lt{width:2.2rem;height:2.2rem;font-size:1.1rem}
.fb .verdict{font-size:1.25rem;padding:.35rem 1rem}.fb .verdict .pts{font-size:1.4rem}
.fb .pemb{font-size:1.05rem;padding:.6rem 1rem}
@keyframes rightp{40%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-.5rem)}40%,80%{transform:translateX(.5rem)}}
.verdict{display:flex;align-items:center;gap:1rem;padding:.6rem 1.2rem;border-radius:1.1rem;font-weight:900;font-size:1.5rem;animation:popIn .4s}
.verdict.ok{background:rgba(52,211,153,.2);border:2px solid var(--green);color:#a7f3d0}
.verdict.bad{background:rgba(251,113,133,.2);border:2px solid var(--red);color:#fecdd3}
.verdict.mid{background:rgba(253,224,71,.16);border:2px solid var(--yellow);color:#fef08a}
.verdict .pts{margin-left:auto;font-size:1.8rem}
.pemb{padding:.8rem 1.2rem;border-radius:1.1rem;background:rgba(56,189,248,.12);border:1px solid rgba(56,189,248,.5);font-size:1.12rem;animation:fadeUp .5s}
.pemb b{color:var(--blue)}
.pemb .ans{display:block;margin-bottom:.3rem;font-weight:800;color:#fff}
.rowend{display:flex;justify-content:flex-end;gap:.8rem;align-items:center;margin-top:auto;flex-wrap:wrap}

/* timer */
.timer{position:relative;width:5.6rem;height:5.6rem;flex:none}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer circle{fill:rgba(0,0,0,.25);stroke-width:9}
.timer .bg{stroke:rgba(255,255,255,.18);fill:none}
.timer .fg{stroke:var(--green);fill:none;stroke-linecap:round;stroke-dasharray:276.5;stroke-dashoffset:0;transition:stroke .3s}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-size:1.9rem;font-weight:900;font-variant-numeric:tabular-nums}
.timer.warn .fg{stroke:var(--red)}
.timer.warn span{color:var(--red);animation:tp .5s infinite alternate}
.timer.mid .fg{stroke:var(--yellow)}
.timer.off .fg{stroke:rgba(255,255,255,.2)}
.timer.off span{color:var(--mut);font-size:1.3rem}
@keyframes tp{to{transform:scale(1.2)}}

/* ---------- round 2 ---------- */
.catwrap{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.cat{display:flex;flex-direction:column;gap:.7rem;padding:.9rem 1rem;border-radius:1.3rem;background:var(--card);border:2px solid var(--line);min-height:0;transition:opacity .3s}
.cat.act{border-color:var(--blue);box-shadow:0 0 2rem rgba(56,189,248,.35)}
.cat.off{opacity:.55}
.cat h3{margin:0;font-size:1.3rem;font-weight:900;display:flex;gap:.6rem;align-items:center}
.cat h3 small{font-size:.8rem;color:var(--mut);font-weight:700}
.cat .grid4{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:.8rem}
.cat .box .no{font-size:2.6rem;width:4.4rem;height:4.4rem}
.cat .box .qq{position:absolute;z-index:3;left:.7rem;top:.5rem;font-size:.85rem;background:rgba(0,0,0,.4);padding:.1rem .6rem;border-radius:1rem}
.stim{padding:.5rem 1.1rem;border-radius:1rem;background:var(--card);border:1px solid var(--line);font-size:1.12rem}
.stim b{color:var(--yellow)}
.seq{display:grid;grid-template-columns:repeat(5,1fr);gap:1.2rem}
.slot{position:relative;min-height:5.2rem;border-radius:1.1rem;border:3px dashed rgba(255,255,255,.4);background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;padding:.5rem;transition:background .15s,border-color .15s}
.slot .num{position:absolute;top:-.9rem;left:.7rem;width:2rem;height:2rem;border-radius:50%;background:linear-gradient(135deg,var(--purple2),var(--blue2));display:grid;place-items:center;font-weight:900;font-size:1rem;border:2px solid #fff}
.seq .slot:not(:last-child)::after{content:"▶";position:absolute;right:-1.15rem;top:50%;transform:translateY(-50%);color:var(--blue);font-size:1.1rem;z-index:3}
.slot .fix{font-size:.82rem;font-weight:800;color:#a7f3d0;text-align:center;line-height:1.15;margin-top:.15rem}
.slot.hasfix{flex-direction:column}
.slot.hot,.pool.hot{background:rgba(56,189,248,.28);border-color:var(--blue)}
.slot.filled{border-style:solid;border-color:rgba(255,255,255,.35)}
.slot.ok{border-color:var(--green);background:rgba(52,211,153,.2);border-style:solid}
.slot.bad{border-color:var(--red);background:rgba(251,113,133,.2);border-style:solid}
.slot.tapme{border-color:var(--yellow);animation:turnp 1.2s infinite;--tc:var(--yellow)}

.chip{display:flex;align-items:center;justify-content:center;text-align:center;min-height:3.4rem;padding:.5rem 1rem;border-radius:.9rem;font-weight:800;font-size:1.12rem;line-height:1.2;user-select:none;-webkit-user-select:none;touch-action:none;cursor:grab;
  background:linear-gradient(160deg,#fff,#dbeafe);color:#0b1f4a;box-shadow:0 .25rem 0 #7aa2e8,0 .5rem 1rem rgba(0,0,0,.3);width:100%;transition:transform .1s}

.chip.ghostsrc{opacity:.25}
.chip.locked{cursor:default;box-shadow:none}
.dragghost{position:fixed;z-index:100;pointer-events:none;opacity:.95;transform:rotate(-3deg) scale(1.06);box-shadow:0 1rem 2rem rgba(0,0,0,.5)!important}
.pool{display:flex;flex-wrap:wrap;gap:.8rem;padding:.9rem;border-radius:1.1rem;min-height:5rem;background:rgba(0,0,0,.25);border:2px dashed rgba(255,255,255,.25);align-items:stretch}

.pool .empty{margin:auto;color:var(--mut);font-weight:700}

.pairs{display:grid;gap:.6rem}

.bpool .pool .chip{max-width:none;flex:none;min-height:3.4rem}
.pr{display:grid;grid-template-columns:minmax(0,.9fr) auto minmax(0,1.3fr);gap:.8rem;align-items:center}
.pr .lbl{display:flex;align-items:center;gap:.7rem;padding:.4rem 1rem;border-radius:1rem;font-weight:800;font-size:1.2rem;background:linear-gradient(135deg,rgba(124,58,237,.55),rgba(37,99,235,.55));border:2px solid rgba(255,255,255,.35);min-height:3.2rem}
.pr .lbl i{font-style:normal;flex:none;width:2rem;height:2rem;border-radius:50%;background:#fff;color:#2b2b8f;display:grid;place-items:center;font-weight:900}
.pr .ar{font-size:1.6rem;color:var(--blue)}
.pr .slot{min-height:3.2rem;padding:.2rem .3rem}
.pairs .chip{min-height:2.6rem;padding:.3rem .8rem;box-shadow:0 .15rem 0 #7aa2e8;font-size:1.05rem}
.key{padding:.7rem 1.1rem;border-radius:1rem;background:rgba(52,211,153,.13);border:1px solid rgba(52,211,153,.5);font-size:1.05rem}

.key .ln{display:flex;flex-wrap:wrap;gap:.35rem .5rem;align-items:center;margin-top:.3rem}
.key .ln span{background:rgba(255,255,255,.14);padding:.15rem .7rem;border-radius:.6rem;font-weight:700}

/* ---------- round 3 ---------- */
.cases{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-template-rows:minmax(0,1fr);gap:1rem}

.c3{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:1rem}
.cl{display:flex;flex-direction:column;gap:.7rem;min-height:0;overflow:auto;padding-right:.3rem}
.casecard{padding:.8rem 1.2rem;border-radius:1.3rem;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line)}

.casecard .st{font-size:1.3rem;line-height:1.4;font-weight:600}
.qbox{padding:.6rem 1.1rem;border-radius:1.1rem;background:rgba(56,189,248,.14);border:2px solid var(--blue);font-size:1.18rem;font-weight:800}
.qbox small{display:block;font-size:.8rem;letter-spacing:.14em;color:var(--blue);margin-bottom:.2rem}
.hintc{padding:.35rem 1rem;border-radius:.9rem;background:rgba(253,224,71,.14);border:1px dashed var(--yellow);color:#fef08a;font-weight:700;font-size:1.05rem}
.tmr{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.4rem .7rem;border-radius:1.1rem;background:var(--card);border:2px dashed var(--purple)}
.tmr .tl{font-weight:900;color:#e4d9ff;font-size:.9rem}
.tmr .timer{width:3.6rem;height:3.6rem}.tmr .timer span{font-size:1.2rem}
.rub{display:flex;flex-direction:column;gap:.45rem;padding:.7rem .9rem;border-radius:1.3rem;background:rgba(124,58,237,.16);border:2px dashed var(--purple);overflow:auto;min-height:0}
.rub h3{margin:0;font-size:1.1rem;letter-spacing:.06em;font-weight:900;color:#e4d9ff}
.asp{padding:.3rem .5rem .4rem;border-radius:.9rem;background:rgba(0,0,0,.22)}
.asp .al{font-size:.85rem;font-weight:700;margin-bottom:.2rem;line-height:1.2;display:flex;justify-content:space-between;gap:.5rem}
.asp .al b{color:var(--yellow);font-variant-numeric:tabular-nums}
.sc4{display:grid;grid-template-columns:repeat(4,1fr);gap:.4rem}
.sv{min-height:max(48px,2.3rem);border-radius:.8rem;font-weight:900;font-size:1.2rem;background:rgba(255,255,255,.12);border:2px solid var(--line)}
.sv.on{background:linear-gradient(180deg,#a78bfa,var(--purple2));border-color:#fff;box-shadow:0 0 1rem rgba(167,139,250,.8)}
.sv:disabled{opacity:.55}
.sv.on:disabled{opacity:1}
.legend{font-size:.72rem;color:var(--mut);line-height:1.25}
.tot{display:flex;align-items:baseline;justify-content:space-between;font-weight:900;font-size:1.1rem}
.tot b{font-size:1.9rem;color:var(--yellow)}
.rbtns{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.rbtns .btn{font-size:.85rem;padding:.3rem .5rem;min-height:max(48px,2.7rem)}

/* ---------- done / final ---------- */
.done{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;text-align:center;animation:popIn .6s}
.done .trophy{font-size:5.5rem;line-height:1;animation:floaty 2.6s ease-in-out infinite;filter:drop-shadow(0 0 1.5rem rgba(253,224,71,.7))}
.done h2{margin:0;font-size:3rem;font-weight:900;background:linear-gradient(90deg,var(--yellow),#fff,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.done .praise{font-size:1.5rem;font-weight:800;color:var(--yellow)}
.rank{width:min(46rem,92%);display:grid;gap:.5rem}
.rk{display:grid;grid-template-columns:2.4rem 9rem 1fr 4.5rem;gap:.8rem;align-items:center;font-weight:800;font-size:1.15rem}
.rk .bar{height:1.5rem;border-radius:1rem;background:rgba(255,255,255,.12);overflow:hidden}
.rk .bar i{display:block;height:100%;background:var(--tc);border-radius:1rem;transition:width 1s .2s;box-shadow:0 0 1rem var(--tc)}
.rk .n{text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .v{text-align:right;font-size:1.4rem}
.rk .md{font-size:1.5rem}

.final .hd{text-align:center}

.final .win{margin:.2rem 0 0;font-size:1.7rem;font-weight:900;animation:fadeUp 1s .2s both}
.final .win span{color:var(--yellow)}
.fcols{min-height:0;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:1.4rem;align-items:center}
.podium{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.7rem;align-items:end;height:100%;max-height:26rem;align-self:center}
.pcol{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:.3rem;animation:riseUp 1s both}
.pcol.p1{animation-delay:.6s}.pcol.p2{animation-delay:.3s}.pcol.p3{animation-delay:0s}
@keyframes riseUp{from{opacity:0;transform:translateY(5rem)}to{opacity:1;transform:none}}
.pcol .nm{font-weight:900;font-size:1.2rem;text-align:center;line-height:1.1;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pcol .pt{font-weight:800;color:var(--mut);font-size:.95rem}
.pcol .ic{font-size:2.8rem;line-height:1}

table.rc td.rk0{font-size:1.4rem}

.detail{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:.7rem;padding:.9rem 1.5rem}

.modal{position:fixed;inset:0;z-index:120;background:rgba(2,8,24,.78);backdrop-filter:blur(6px);display:grid;place-items:center;animation:fadeIn .2s;padding:1rem}

.mbox h2{margin:0 0 .6rem;font-size:1.6rem;font-weight:900}
.mbox p{font-size:1.1rem;margin:.4rem 0 1rem}
.mrow{display:flex;gap:.8rem;justify-content:flex-end;flex-wrap:wrap;margin-top:.8rem}
.sec{margin:.8rem 0 .3rem;font-weight:900;font-size:.85rem;letter-spacing:.1em;color:var(--blue)}
.chips{display:flex;gap:.5rem;flex-wrap:wrap}
.tg{min-height:max(48px,2.8rem);padding:.3rem 1rem;border-radius:.8rem;font-weight:800;border:2px solid var(--tc);background:color-mix(in srgb,var(--tc) 30%,#0b1a40)}
.tg.on{background:var(--tc);color:var(--ti)}
.tg:disabled{opacity:.4}

.bq{padding:.8rem 1rem;border-radius:1rem;background:rgba(255,255,255,.09);font-size:1.2rem;font-weight:700;margin:.4rem 0}
.hide{display:none!important}

@media (max-aspect-ratio:1/1){
  html{font-size:max(12px,min(2.4vw,1.6vh))}
  .home{grid-template-columns:1fr;overflow:auto}

  .seq{grid-template-columns:1fr 1fr}
  .board{grid-template-columns:1fr 1fr}
  .steps{display:none}
}
@media (max-height:620px){.rtitle p{display:none}.home h1{font-size:2.6rem}}

@media print{
  @page{size:A4 landscape;margin:10mm}
  html,body{overflow:visible;height:auto;background:#fff!important;color:#000}
  body::before,#fx,.noprint,.top .ctrls,.steps{display:none!important}
  .final,.detail{height:auto;display:block;padding:0}

  .fcols{display:block}
  .podium{max-height:none;height:16rem;margin-bottom:1rem}
  table.rc th{color:#333}
  table.rc td{background:#f1f1f1;color:#000;border:1px solid #bbb}
  table.rc td.tt{color:#000}
  .pcol,.final .hd h1,.final .win{animation:none!important}
  .pcol .nm,.pcol .pt{color:#000}
  .dc{background:#fff;color:#000;border:2px solid var(--tc)}

  .dgrid{overflow:visible;grid-template-columns:1fr 1fr}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}

function r1Score(t){return S.r1?Object.values(S.r1.results).filter(x=>x.team===t).reduce((s,x)=>s+x.pts,0):0;}
function r1Count(){return S.r1?Object.keys(S.r1.results).length:0;}
function r2Part(t,c){if(!S.r2)return null;const e=Object.values(S.r2['done'+c]).find(x=>x.team===t);return e?e.score:null;}
function r2Score(t){return (r2Part(t,'A')||0)+(r2Part(t,'B')||0);}
function r3Case(t){return S.r3?Object.entries(S.r3.cases).find(([b,c])=>c.team===t):null;}
function r3Score(t){const e=r3Case(t);return e&&e[1].saved?e[1].s.reduce((a,b)=>a+b,0):0;}
function totals(t){const a=r1Score(t),b=r2Score(t),c=r3Score(t);return {r1:a,r2:b,r3:c,total:a+b+c};}

function ranking(){
  const rows=range(4).map(t=>({t,...totals(t)}));
  const grp={};rows.forEach(r=>{(grp[r.total+'|'+r.r3]=grp[r.total+'|'+r.r3]||[]).push(r.t);});
  rows.forEach(r=>{
    const g=grp[r.total+'|'+r.r3];r.tieKey=g.length>1?r.total+'|'+r.r3:null;
    const o=r.tieKey&&S.tb[r.tieKey];r.tb=o&&o.length===g.length?o.indexOf(r.t):(g.length>1?-1:0);
  });
  rows.sort((a,b)=>b.total-a.total||b.r3-a.r3||((a.tb<0?99:a.tb)-(b.tb<0?99:b.tb))||a.t-b.t);
  rows.forEach(r=>{
    const unres=r.tieKey&&r.tb<0;r.unres=!!unres;
    r.rank=1+rows.filter(o=>o.total>r.total||(o.total===r.total&&o.r3>r.r3)||(o.total===r.total&&o.r3===r.r3&&!unres&&!o.unres&&o.tb<r.tb)).length;
  });
  return rows;
}

let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function tone(f,d,type='sine',at=0,g=.18,f2=null){
  const c=ac();if(!c)return;const t=c.currentTime+at;const o=c.createOscillator(),v=c.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  v.gain.setValueAtTime(0,t);v.gain.linearRampToValueAtTime(g,t+.02);v.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(v);v.connect(c.destination);o.start(t);o.stop(t+d+.05);
}
function sfx(k){
  if(!S.sound)return;
  try{
  if(k==='ok'){[523,659,784,1046].forEach((f,i)=>tone(f,.28,'triangle',i*.09));}
  else if(k==='bad'){tone(240,.5,'sawtooth',0,.14,110);tone(180,.5,'square',.05,.08,90);}
  else if(k==='part'){tone(440,.2,'triangle',0);tone(523,.3,'triangle',.12);}
  else if(k==='open'){tone(300,.15,'square',0,.08,700);tone(700,.2,'triangle',.1,.12);}
  else if(k==='tick'){tone(900,.07,'square',0,.06);}
  else if(k==='time'){tone(220,.7,'sawtooth',0,.15,160);}
  else if(k==='round'||k==='done'){[392,523,659,784,1046].forEach((f,i)=>tone(f,.35,'triangle',i*.1,.16));}
  else if(k==='start'){[330,415,523,659].forEach((f,i)=>tone(f,.3,'triangle',i*.1,.15));}
  else if(k==='win'){[523,523,523,659,587,659,784,1046,784,1046,1318].forEach((f,i)=>tone(f,.32,'triangle',i*.13,.17));}
  else if(k==='tap'){tone(600,.05,'sine',0,.07);}
  }catch(e){}
}

const fx=$('#fx'),fxc=fx.getContext('2d');let parts=[],raf=0;
function sizeFx(){fx.width=innerWidth;fx.height=innerHeight;}addEventListener('resize',sizeFx);sizeFx();
function confetti(n=140,big=false){
  const cols=['#e11d48','#2563eb','#22c55e','#facc15','#a78bfa','#38bdf8','#fff'];
  for(let i=0;i<n;i++)parts.push({x:Math.random()*fx.width,y:-20-Math.random()*fx.height*.4,vx:(Math.random()-.5)*5,vy:2+Math.random()*5,w:8+Math.random()*10,h:5+Math.random()*8,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[(Math.random()*cols.length)|0],life:big?420:260});
  if(!raf)raf=requestAnimationFrame(stepFx);
}
function stepFx(){
  fxc.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;p.life--;fxc.save();fxc.translate(p.x,p.y);fxc.rotate(p.r);fxc.globalAlpha=Math.min(1,p.life/40);fxc.fillStyle=p.c;fxc.fillRect(-p.w/2,-p.h/2,p.w,p.h);fxc.restore();});
  parts=parts.filter(p=>p.life>0&&p.y<fx.height+30);
  if(parts.length)raf=requestAnimationFrame(stepFx);else{raf=0;fxc.clearRect(0,0,fx.width,fx.height);}
}

/* timer */
function timerHTML(total,off){return `<div class="timer ${off?'off':''}" id="timer" data-total="${total}"><svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="tfg" cx="50" cy="50" r="44"/></svg><span id="tnum">${off?'—':Math.ceil(total)}</span></div>`;}
function fmtT(s){s=Math.ceil(s);return s>=60?`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`:String(s);}
function setTimerUI(rem,total){
  const t=$('#timer');if(!t)return;
  const fg=$('#tfg'),n=$('#tnum');
  fg.style.strokeDashoffset=(276.5*(1-Math.max(0,rem)/total)).toFixed(1);
  n.textContent=fmtT(rem);
  t.classList.toggle('warn',rem<=5&&rem>0);t.classList.toggle('mid',rem>5&&rem<=total*.4);
}
let lastTickSec=-1;
function curTimer(){
  if(S.page==='r1'&&S.r1.active&&!S.r1.active.locked)return {dl:S.r1.active.deadline,total:20,end:()=>r1Lock(null,true)};
  if(S.page==='r2'&&S.r2.active&&!S.r2.active.locked)return {dl:S.r2.active.deadline,total:90,end:()=>r2Check(true)};
  if(S.page==='r3'&&S.r3.timer&&!S.r3.timer.ended)return {dl:S.r3.timer.deadline,total:S.r3.timer.total,end:()=>{S.r3.timer.ended=true;save();sfx('time');const tm=$('#timer');if(tm){tm.classList.add('warn');$('#tnum').textContent='0';}toast('⏰ Waktu habis!');}};
  return null;
}
function tick(){
  const c=curTimer();if(!c)return;
  const rem=Math.max(0,(c.dl-Date.now())/1000);
  setTimerUI(rem,c.total);
  const s=Math.ceil(rem);
  if(rem>0&&rem<=5&&s!==lastTickSec){lastTickSec=s;sfx('tick');}
  if(rem<=0)c.end();
}
setInterval(tick,200);

function render(){
  const app=$('#app');

  tick();
}

let sel=null; /* pilihan ketuk {idx, from} */

  let result='',nextb='';
  if(a.locked){
    const c=a.correct;
    result=`<div class="verdict ${c===n?'ok':(c>0?'mid':'bad')}">${a.timeout?'⏰ WAKTU HABIS — ':''}${c===n?'🎉 SEMPURNA!':(c>0?'👍 Sebagian benar':'❌ Belum tepat')} · ${c} dari ${n} ${isA?'posisi':'pasangan'} benar<span class="pts">+${fmt(a.score)} poin</span></div>
    ${isA?`<div class="key"><b>Urutan yang benar:</b><div class="ln">${q.order.map((o,i)=>`<span>${i+1}. ${esc(o)}</span>`).join('<em>→</em>')}</div></div>`:''}
    <div class="pemb"><b>Pembahasan:</b> ${esc(q.pemb)}</div>`;
    nextb=`<button class="btn go big" data-act="r2Next">${a.cat==='A'?`LANJUT KE KATEGORI B ▶`:`${S.r2.turn!=null&&[0,1,2,3].filter(t=>!(r2has('A',t)&&r2has('B',t))).length?'LANJUT KE TIM BERIKUTNYA':'SELESAI'} ▶`}</button>`;

let drag=null,lastDragEnd=0;
function placeChip(idx,from,target){
  const a=S.r2.active;if(!a||a.locked)return;
  if(target==='pool'){if(from!=='pool')a.placed[+from]=null;}
  else if(target!=null&&target!==''){
    const s=+target,occ=a.placed[s];
    if(from!=='pool')a.placed[+from]=occ;
    a.placed[s]=idx;
  }
  sel=null;sfx('tap');commit();
}
document.addEventListener('pointerdown',e=>{
  const chip=e.target.closest('.chip');
  if(!chip||S.page!=='r2'||!S.r2.active||S.r2.active.locked||e.button>0)return;
  const r=chip.getBoundingClientRect();
  drag={chip,idx:+chip.dataset.chip,from:chip.dataset.from,sx:e.clientX,sy:e.clientY,ox:e.clientX-r.left,oy:e.clientY-r.top,w:r.width,moved:false,ghost:null,id:e.pointerId};
});
document.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<9)return;
    drag.moved=true;const g=drag.chip.cloneNode(true);g.classList.add('dragghost');g.style.width=drag.w+'px';document.body.appendChild(g);drag.ghost=g;drag.chip.classList.add('ghostsrc');}
  e.preventDefault();
  drag.ghost.style.left=(e.clientX-drag.ox)+'px';drag.ghost.style.top=(e.clientY-drag.oy)+'px';
  $$('.hot').forEach(x=>x.classList.remove('hot'));
  const sc=$('.qscroll');if(sc){const b=sc.getBoundingClientRect();if(e.clientY>b.bottom-70)sc.scrollTop+=18;else if(e.clientY<b.top+70)sc.scrollTop-=18;}
  const t=document.elementFromPoint(e.clientX,e.clientY);const z=t&&t.closest('[data-slot],[data-pool]');if(z)z.classList.add('hot');
},{passive:false});
function endDrag(e,cancel){
  if(!drag||(e&&e.pointerId!==drag.id))return;
  const d=drag;drag=null;
  if(d.ghost)d.ghost.remove();$$('.hot').forEach(x=>x.classList.remove('hot'));
  if(!d.moved)return;
  lastDragEnd=Date.now();
  if(cancel)return commit();
  const t=document.elementFromPoint(e.clientX,e.clientY);const z=t&&t.closest('[data-slot],[data-pool]');
  if(!z)return commit();
  placeChip(d.idx,d.from,z.dataset.pool?'pool':z.dataset.slot);
}
document.addEventListener('pointerup',e=>endDrag(e,false));
document.addEventListener('pointercancel',e=>endDrag(e,true));
/* ketuk-lalu-ketuk (alternatif) */
function tapChip(chip){
  const a=S.r2.active;if(!a||a.locked)return;
  const idx=+chip.dataset.chip,from=chip.dataset.from;
  if(!sel){sel={idx,from};sfx('tap');return commit();}
  if(sel.idx===idx){sel=null;return commit();}
  if(from==='pool'){ if(sel.from!=='pool')return placeChip(sel.idx,sel.from,'pool'); sel={idx,from};return commit(); }
  placeChip(sel.idx,sel.from,from);
}
document.addEventListener('click',e=>{
  if(Date.now()-lastDragEnd<350&&e.target.closest('.chip,[data-slot],[data-pool]')){return;}
  if(S.page==='r2'&&S.r2&&S.r2.active&&!S.r2.active.locked){
    const chip=e.target.closest('.chip');
    if(chip){tapChip(chip);return;}
    const sl=e.target.closest('[data-slot]');
    if(sl){if(sel)placeChip(sel.idx,sel.from,sl.dataset.slot);return;}
    const pl=e.target.closest('[data-pool]');
    if(pl){if(sel&&sel.from!=='pool')placeChip(sel.idx,sel.from,'pool');return;}
  }
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act;
  if(act==='mbg'){if(e.target===el)closeModal();return;}
  if(el.closest('.mbox')&&act==='mbg')return;
  ac();

});

  modal(`<h2>⚖️ Soal Penentu Juara</h2><p>Tim yang seri: <b>${g.map(t=>esc(nm(t))).join(', ')}</b> (total dan skor Ronde 3 sama). Guru membacakan soal tambahan, lalu menetapkan urutan tim dari yang terbaik.</p>
   <div class="bq">${esc(bq.q)}</div>${st.show?`<div class="pemb"><b>Jawaban:</b> ${esc(bq.a)}</div>`:''}
   <div class="mrow" style="justify-content:flex-start"><button class="btn ghost sm" data-act="tbShow">👁 Tampilkan jawaban</button><button class="btn ghost sm" data-act="tbNext">⟳ Soal lain</button></div>
   <div class="sec">KETUK TIM SESUAI URUTAN, DARI PEMENANG (URUTAN 1) KE BAWAH</div>
   <div class="chips">${g.map(t=>`<button class="tg ${st.order.includes(t)?'on':''}" style="${ts(t)}" data-act="tbPick" data-t="${t}" ${st.order.includes(t)?'disabled':''}>${st.order.includes(t)?(st.order.indexOf(t)+1)+'. ':''}${esc(nm(t))}</button>`).join('')}</div>
   <div class="mrow"><button class="btn ghost" data-act="closeModal">Tutup</button><button class="btn ghost" data-act="tbClear">Ulangi urutan</button></div>`);
}
A_.tbShow=function(){tbState.show=true;tbModal();};
A_.tbNext=function(){tbState.q++;tbState.show=false;tbState.order=[];tbModal();};
A_.tbClear=function(){tbState.order=[];tbModal();};
A_.tbPick=function(el){
  const st=tbState;st.order.push(+el.dataset.t);
  const rk=ranking();const g=rk.filter(r=>r.tieKey===st.keys[st.ki]).length;
  if(st.order.length===g){S.tb[st.keys[st.ki]]=st.order.slice();save();st.ki++;st.order=[];st.show=false;
    if(st.ki>=st.keys.length){closeModal();toast('Urutan juara ditetapkan.');render();sfx('ok');return;}}
  tbModal();
};

/* ---------- PANEL GURU ---------- */
A_.teacher=function(){
  let h=`<h2>🔒 Panel Guru</h2><div class="sec">STATUS</div><p style="margin:.2rem 0">${S.page==='home'?'Permainan belum dimulai.':'Halaman: <b>'+({r1:'Ronde 1',r2:'Ronde 2',r3:'Ronde 3',final:'Hasil Akhir',detail:'Detail Nilai'}[S.page])+'</b>'}</p>`;
  if(S.page==='r2'&&S.r2.view==='play'&&!S.r2.active){
    h+=`<div class="sec">UBAH GILIRAN RONDE 2</div><div class="chips">${range(4).map(t=>`<button class="tg ${S.r2.turn===t?'on':''}" style="${ts(t)}" data-act="setTurn2" data-t="${t}" ${(r2has('A',t)&&r2has('B',t))?'disabled':''}>${esc(nm(t))}</button>`).join('')}</div>`;
  }
  if(S.page==='r3'&&S.r3.view==='play'&&S.r3.active==null){
    h+=`<div class="sec">UBAH GILIRAN RONDE 3</div><div class="chips">${range(4).map(t=>`<button class="tg ${S.r3.turn===t?'on':''}" style="${ts(t)}" data-act="setTurn3" data-t="${t}" ${r3Case(t)?'disabled':''}>${esc(nm(t))}</button>`).join('')}</div>`;
  }
  h+=`<div class="sec">PENGATURAN</div><div class="chips"><button class="btn ghost sm" data-act="sound">${S.sound?'🔊 Suara: Aktif':'🔇 Suara: Mati'}</button><button class="btn ghost sm" data-act="fs">⛶ Layar penuh</button></div>`;
  if(['r1','r2','r3'].includes(S.page)){
    const v=S[S.page].view;
    h+=`<div class="sec">PENGECUALIAN KELAS</div><p style="margin:.2rem 0 .5rem;font-size:.95rem">Gunakan hanya bila ada tim yang tidak dapat menyelesaikan soal atau penilaian karena kondisi kelas. Soal/penilaian yang belum selesai akan dihitung 0.</p><button class="btn warn sm" data-act="forceDone" ${v==='done'?'disabled':''}>⏭ Akhiri ronde ini sekarang</button>`;
  }
  h+=`<div class="sec">DATA PERMAINAN</div><button class="btn danger sm" data-act="resetAsk">🗑 Reset permainan</button>
   <div class="mrow"><button class="btn" data-act="closeModal">Tutup</button></div>`;
  modal(h);
};
A_.setTurn2=function(el){S.r2.turn=+el.dataset.t;commit();A_.teacher();};
A_.setTurn3=function(el){S.r3.turn=+el.dataset.t;commit();A_.teacher();};
A_.forceDone=function(){
  confirmBox('Akhiri ronde sekarang?','Ronde ini akan dinyatakan selesai walaupun belum semua soal/penilaian tuntas. Bagian yang belum dikerjakan bernilai 0.','Ya, akhiri',()=>{
    closeModal();const p=S.page;
    if(p==='r1'){S.r1.active=null;S.r1.view='done';}
    if(p==='r2'){S.r2.active=null;S.r2.view='done';sel=null;}
    if(p==='r3'){S.r3.active=null;S.r3.timer=null;S.r3.view='done';}
    sfx('done');confetti();commit();},'warn');
};
A_.resetAsk=function(){confirmBox('Reset permainan?','Seluruh skor dan progres akan dihapus dan permainan kembali ke halaman awal.','Ya, reset',()=>resetGame());};
A_.closeModal=closeModal;
A_.confirmYes=function(){const f=confirmBox.fn;closeModal();if(f)f();};
A_.sound=function(){S.sound=!S.sound;save();if(S.sound)sfx('tap');
  if($('.modal'))A_.teacher();render();};
A_.fs=toggleFs;
A_.start=function(){
  $$('.tname').forEach(i=>{S.names[+i.dataset.i]=(i.value.trim().slice(0,18))||DEFNAMES[+i.dataset.i];});
  const seen=new Set();S.names=S.names.map(n=>{let b=n,k=2;while(seen.has(n.toLowerCase()))n=b+' '+(k++);seen.add(n.toLowerCase());return n;});
  S.r1={map:shuffle(range(12)),results:{},active:null,view:'play'};S.r2=null;S.r3=null;S.tb={};
  S.page='r1';fs();sfx('start');commit();
};
document.addEventListener('input',e=>{if(e.target.classList&&e.target.classList.contains('tname')){S.names[+e.target.dataset.i]=e.target.value.slice(0,18);save();}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('tname'))e.target.blur();});
Object.assign(A_,{});

/* ---------- start ---------- */
render();
if(resumed)setTimeout(()=>toast('Permainan dilanjutkan dari halaman terakhir.'),500);
window.__S=()=>S;
</script>
</body>
</html>
